<!doctype html>
<html lang="zh-CN" data-theme="dark" data-accent="lime" data-density="comfortable" data-motion="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080a0c" id="themeColorMeta">
  <meta name="robots" content="noindex">
  <title>页面不存在 · 震纤软件库</title>
  <script src="/boot.js"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="error-page">
  <div class="grain" aria-hidden="true"></div>
  <div class="ambient ambient--one" aria-hidden="true"></div>
  <div class="ambient ambient--two" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="震纤软件库首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <path d="M6 25.5c4.2-13.2 7.7 7.4 12.1-3.4 3.4-8.3 6.3 4.2 9.7-5.1" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M7.5 31.5h25" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
            <circle cx="31.5" cy="9.5" r="2.1" fill="currentColor"/>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>震纤软件库</strong>
          <small>ZHENXIAN LIBRARY</small>
        </span>
      </a>
      <div class="header-actions">
        <a class="button button--ink" href="/">返回首页</a>
      </div>
    </div>
  </header>

  <main class="not-found section-shell">
    <div class="not-found-art" aria-hidden="true">
      <span class="notfound-ring"></span>
      <span class="notfound-number">404</span>
      <span class="notfound-label">LOST IN THE LIBRARY</span>
    </div>
    <div class="not-found-copy">
      <p class="section-kicker">ERROR 404 / PATH NOT FOUND</p>
      <h1>这条路径，<br><span>不在软件库里。</span></h1>
      <p>页面可能被移动、删除，或者从未存在。回到首页，继续寻找那些值得留在桌面上的工具。</p>
      <div class="notfound-actions">
        <a class="button button--primary" href="/">回到首页 <span aria-hidden="true">↗</span></a>
        <a class="button button--ghost" href="/#library">浏览软件库</a>
      </div>
    </div>
  </main>

  <footer class="error-footer section-shell">
    <span>© 2026 震纤软件库 · ZHENXIAN LIBRARY</span>
    <span>认真试用，再认真推荐。</span>
  </footer>
</body>
</html>
